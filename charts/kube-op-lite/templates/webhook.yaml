{{- if .Values.webhook.enabled }}
# Admission webhooks. These require TLS certs; this template uses cert-manager to
# issue a self-signed cert and inject the CA bundle. Install cert-manager first:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
spec:
  dnsNames:
  - {{ include "kube-op-lite.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ include "kube-op-lite.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "kube-op-lite.fullname" . }}-selfsigned
  secretName: {{ include "kube-op-lite.fullname" . }}-webhook-cert
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kube-op-lite.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
  - port: 443
    targetPort: 9443
    protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-mutating-webhook
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-op-lite.fullname" . }}-serving-cert
webhooks:
- name: mgpuworkload.kb.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: {{ include "kube-op-lite.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-gpu-kube-op-lite-io-v1alpha1-gpuworkload
  rules:
  - apiGroups: ["gpu.kube-op-lite.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["gpuworkloads"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-validating-webhook
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-op-lite.fullname" . }}-serving-cert
webhooks:
- name: vgpuworkload.kb.io
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: {{ include "kube-op-lite.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-gpu-kube-op-lite-io-v1alpha1-gpuworkload
  rules:
  - apiGroups: ["gpu.kube-op-lite.io"]
    apiVersions: ["v1alpha1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["gpuworkloads"]
{{- end }}
