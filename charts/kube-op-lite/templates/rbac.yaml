apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-manager-role
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
rules:
- apiGroups: ["gpu.kube-op-lite.io"]
  resources: ["gpuworkloads"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["gpu.kube-op-lite.io"]
  resources: ["gpuworkloads/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["gpu.kube-op-lite.io"]
  resources: ["gpuworkloads/finalizers"]
  verbs: ["update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-op-lite.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "kube-op-lite.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader-election role (namespaced).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-op-lite.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-op-lite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-op-lite.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "kube-op-lite.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
